name: Quality and security

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run optional disposable FalkorDB integration job
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src tests scripts app.py
      - run: python -m pytest
      - run: bandit -r src scripts -q
      - run: python scripts/check_secrets.py --history
      - run: python -m pip check

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FALKORDB_HOST: 127.0.0.1
      FALKORDB_PORT: '6379'
      FALKORDB_GRAPH: ci_${{ github.run_id }}_${{ github.run_attempt }}
      FALKORDB_INTEGRATION: '1'
      LLM_PROVIDER: deterministic
    services:
      falkordb:
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m src.health
      - run: python -m src.seed
      - run: python -m src.seed --validate
      - run: python -m pytest
